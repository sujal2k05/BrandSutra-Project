spring.application.name=brandsutra-backend

# Support optional local property overrides (ignored by Git)
spring.config.import=optional:classpath:application-local.properties

# Server Configuration
server.port=${PORT:8080}

# Database Configuration (MySQL 8)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/brandsutra_db?createDatabaseIfNotExist=false&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration (Guidelines & PDF extraction)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Security / JWT Configuration (Provide via environment variable JWT_SECRET or application-local.properties)
brandsutra.jwt.secret=${JWT_SECRET:}
brandsutra.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# AI Microservice URL & API Key (Provide via environment variable AI_SERVICE_API_KEY or application-local.properties)
brandsutra.ai-service.url=${AI_SERVICE_URL:http://localhost:8000}
brandsutra.ai-service.api-key=${AI_SERVICE_API_KEY:}

